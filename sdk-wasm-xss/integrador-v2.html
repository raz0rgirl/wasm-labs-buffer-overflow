<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrador (v2) — SDK endurecido</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    button { padding: 8px 16px; cursor: pointer; }
    .box { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
    code { background: #eee; padding: 1px 4px; border-radius: 3px; }
  </style>

  <!--
    Mesmo XSS refletido PROPOSITAL da v1 (?msg= via innerHTML). A diferença
    está no SDK (v2), não na página: queremos ver a v2 resistir aos mesmos
    ataques. A falha de XSS continua aqui de propósito, para fins didáticos.
  -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var msg = params.get('msg') || 'Bem-vindo ao integrador (v2)!';
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('saida').innerHTML = msg; // SINK vulnerável (proposital)
      });
    })();
  </script>
</head>
<body>
  <h1>Integrador — SDK v2 (endurecido)</h1>

  <div class="box">
    <strong>Mensagem (vulnerável a XSS):</strong>
    <div id="saida"></div>
  </div>

  <div class="box">
    <p>O SDK v2 não expõe nada em <code>window</code>. O botão é ligado por dentro do SDK.</p>
    <button id="btn">Rodar SDK (fluxo honesto)</button>
    <pre id="resultado-sdk">(sem resultado ainda)</pre>
  </div>

  <!-- v2: IIFE, sem window.sdk. -->
  <script src="/sdk-v2/sdk.js"></script>
</body>
</html>
